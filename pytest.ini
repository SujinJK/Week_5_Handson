[pytest]
; Three different tests/ folders (tests/, repo_summarizer/tests/,
; trip_planner/tests/) each have same-named files (test_tools.py,
; test_report.py). Without this, pytest's default import mode inserts
; each folder into sys.path and imports test files by bare basename,
; so two files both named test_tools.py collide as the same module --
; discovered live, running the full suite across all three agents at
; once for the first time (each agent's own tests passed fine in
; isolation, which is why this wasn't caught earlier). importlib mode
; gives each test file a unique, fully-qualified module identity based
; on its actual file path instead, which sidesteps the collision
; without needing an __init__.py in every tests/ folder.
addopts = --import-mode=importlib
